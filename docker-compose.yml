version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ssaems-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ssaems
    networks:
      - ssaems-network

  backend:
    build: ./backend
    container_name: ssaems-backend
    restart: always
    ports:
      - "5050:5050"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/ssaems
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5050
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - mongodb
    networks:
      - ssaems-network
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: ssaems-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ssaems-network

volumes:
  mongodb_data:
    driver: local

networks:
  ssaems-network:
    driver: bridge
